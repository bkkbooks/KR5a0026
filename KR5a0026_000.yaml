front:
  text: 太上九天延祥滌厄四聖妙經妟六
  hash: sha256:89efc5ee309b238db4589ebdc0489831f2a11db50945e849c327df227784442a
  markers:
  - {type: page-break, offset: 0, content: '', id: KR5a0026_HFL_000-001a, image: hfl/0027/0027-016.png}
body:
  text: 啓請呪仰啓北方四元帥束縛羣魔大聖尊披頭仗劔偉形容百萬天兵常擁護天蓬天猷除凶惡翊聖真武賜吉祥臣今伏願降靈壇一切災厄自消散至心皈命禮六龍陛左九虎關中現三頭六臂之威容運七政八靈之洪造帝鐘才震萬聖齊臨鉞斧輕揮羣魔碎滅神光赫赫常救護於衆生真性巍巍誓永興於正道劈尸千里斬鬼五形大悲大願大聖大慈通天析祐延祥滌厄保寧身命北極天蓬八十一軍大元帥護國消魔真君證果法雲普覆天尊至心皈命禮妙有天中通明殿右領天罡之次帥列下土之諸侯憫凡庸迷謬以喪真仰聖相大光而作序讃演諸天之隱韻述敷大梵之仙章俯憐崇奉之誠大賜護持之力雲隨步發海逐身流大悲大願大聖大慈通天祈祐延祥滌厄滋育身命北極天猷大元帥普化天帝證果沖和應善天尊至心皈命禮帝間功成天庭位列總三洞五雷之號令掌八天九地之權衡慜造化之樞機僚真仙之將吏無邪不斬何鬼敢當攝大力之妖魔逐流星之芒怪光華日月威震乾坤大悲大願大聖大慈通天祈祐延祥滌厄護持身命北極翊聖黑殺大元帥儲慶保德真君證果遊行三界天尊至心皈命禮虛危分宿壬癸孕靈化身自金闕之尊居位極玉虛之奧玄妙極至奚止於輔正除邪正一所生豈但於消魔護國保劫終而制劫始護羣品而掌羣仙勇果全才威神備德大悲大願大聖大慈通天祈祐延祥滌厄安和身命北極佑聖真武大元帥玄天元聖仁威上帝金闕化身證果終劫濟苦天尊至心皈命禮始青天之最上天清都闕之真妙闕承五色光明之洞照一會罕逢聽九天延祥之玄機四真可仗喜遇金方之皇老重啓塵世之業因幸元尊垂示以符文對衆聖重付以祕呪開大地析祥之便路彰大玄有感之赫靈何災不滅何福不臻依願而行依誠而應大悲大願大聖大慈靈臺會上滌厄品中十方上聖諸天帝君三官五帝日月諸星北斗南辰真人神仙至真大聖九天文人天曹列聖生日本命運限星辰四聖部中靈童力士神王猛將北方兵從法籙威神嶽瀆主宰祀典神祇經筵鑒證一切真靈伏願愚忱上達聖駕俯臨滅災録善而所啓所從馘毒衛生而作威作福願與諸含生一心皈命禮開經玄藴呪天地真元象人間道德尊天文書八角悟者釋邪根勤意通丹闕虔心達紫清祥煙森八極瑞靄布仙京渺渺三乘理明明一性存今思最上法願得出迷津太上九天延祥滌厄四聖妙經爾時元始天尊在始青天中玉都之闕靈臺之上放五色光明色色俱異洞照內外皆使朗徹大會十方諸天日月星宿三官四聖北斗南辰真人神仙至真大神四維上下嶽讀主宰無鞅數衆説無為妙道金光射日紫靄盈身法雨遍施靈風普扇金童執節玉女捧香鸞鳯交嗚妃后奏樂座前土木百精皆聽思議是時座下有一天君號曰西方白帝七氣天君執簡長跪上白天尊曰臣觀世間人處牢籠種種不同或有衣之錦繡食之珍羞金殿玉堂雕梁峻宇或有朝丐暮覔服露殘軀神廟依棲竄身無地或有雖生人道傴僂瘡癩人皆憎嫌寒餓困窮盲聾喑啞手攣腳跛身不具足或為下賤笞撻苦楚萬種千辛無門可告或有恃上逼下以強凌弱未審此因緣何若是小臣未曉伏願天顏不捨大開妙義以明未悟以解無知天尊言善哉白帝發問斯由復坐存真吾為汝説夫人者誕育塵寰戴天履地自幼至老自壯及衰喜名利之華樂生生之厚馳逞不息豈顧危亡陷溺賢良任為三業起造六根竟生六根既與九結為禍是故有身即有纍有纍即有業有業即有報既知有報全在修持生諸省悟且衆生之果貧窮下賤宿業相成富貴榮華前生所積善惡昭昭二徑羣迷任向一途善者當有善報惡者乃處惡根過去今生如斯是理天君再問人生或有疾病困篤年命災衰邪鬼來侵妖魔作害以何善利可以驅除答曰世人不知已身如風如燭幻化浮生念念因循豈可久長爭財競寶利已損他口是心非恣情嫉妬故使妖魔作害無可依投致得橫傷枉遭諸苦吾家自有四將當為至誠密念其文無所不應天君曰四將是何惟願慈尊明書其迹天尊曰北方自有天蓬天猷翊聖真武統領天兵驅遣將吏如有急難可以注念自降神威隨念而至靈光赫赫殺氣巍巍魔鬼濽形精邪伏匿一切災殃盡皆消滅爾時天尊慜念衆生即説通天祈祐延祥滌厄四聖神呪天蓬呪曰天蓬天蓬九玄殺童五丁都司髙刀北翁七政八靈太上皓凶長顱巨獸手把帝鐘素梟三神嚴駕夔龍威劒神王斬邪滅蹤紫氣乘天丹霞赫衝吞魔食鬼橫身飲風蒼舌緑齒四目老翁天丁力士威南禦凶天騶激戾威北㗸鋒三十萬兵衛我九重劈尸千里祛却不祥敢有小鬼欲來見狀钁天大斧斬鬼五形炎帝烈血北斗然骨四明破骸天猷滅類神刀一下萬鬼自潰急急如律令天猷呪曰天猷天猷位列諸侯上位北帝下臨九州肩生四臂項長三頭身披金甲手執戈矛雲隨步發海逐身流紅光杳杳紫氣悠悠雄風靉靉猛霧颼颼真氣宛轉星斗四周千神自朝五嶽巡遊金童鼓吹玉女歌謳名列金闕位鎮酆幽蒼禽獅子巨海蛟虬三十萬兵從我周遊逢妖即斬遇鬼皆收人遭尤善祟遇無休降臨福氣滌蕩無憂無知小鬼敢有遲留吾目一視永作泉囚急急如律令黑殺呪曰北方黑帝太微六甲五帝靈君光華日月威震乾坤走符攝籙絶斷鬼門行神布氣攝除五瘟左右吏兵三五將軍雷公霹靂電激風奔刀劒如雨隊仗如雲手把帝鐘頭戴崑崙行繞天下搜捉鬼神九州社令血食之兵不許拒逆敢有張鱗鎮星縛手北斗收魂三台七星持劒斬身罪不重考殃及子孫邪精魍魎耳不得聞聞吾呪者頭破腦裂碎如微塵急急如律令真武神呪乾元有將頂戴三台披髮圎象真武威靈助吾大道龜蛇合形身如山嶽四氣朗清金光赫赫努目光明牙如劒樹手執七星天魔外道鬼魅妖精見吾為血化作紫塵魁罡正氣是吾本身天符通現大保乾坤江河淮濟五嶽之神城隍社令拱聽吾命指揮綱紀敢有攝停上帝有勑救護羣生敢有小鬼捉縛來呈急急如律令天尊再言曰衆生處於三毒十惡之世常被諸魍魎精魅惡鬼邪神毒蟲猛獸刀兵水火杻械牢獄疾病苦痛一一纒染不能自安吾先曽出妙法普度衆生以符圖神呪付諸法學及三天大魔王分布人間救護一切今得自然凡夫破齋犯戒違天負地不識因緣不知善惡不親聖教不近仙宗漸入邪風隨諸煩惱明明造惡密密故為恣縱身心損傷物命天道不遠如鑑如水一一無差是故毒風惡氣六天魔鬼遍滿人間流行殺伐中害死傷日夜萬計不可稱量吾遣諸天十極神王下降人間廣行救度拯濟衆生今得清吉人豈知之今後世人若能投承大道篤敬真宗謝過祈恩禳災益算無門可解或新蓋宅宇動土興工犯觸禁方當於中庭燃燈七盞備時新五果燒種種名香至心望北念經朱書四聖靈符貼於舍內四隅自獲禎祥四天帝王四聖元帥來下扶護此之妙典所禳者伏所求者應所陳者達所啓者從四聖真君應號真符第一北極天蓬大元帥延祥滌厄保寧身命第二北極天猷副元帥延祥滌厄滋育身命第三翊聖儲慶保德真君延祥滌厄護持身命第四北極佑聖真武真君延祥滌厄安和身命天尊曰此四聖名號經呪其功甚大若遇年災月厄當面北焚香存神靜慮至心禮念皆得消散或遇身多疾病服藥不痊亦當面北存神靜慮至心禮念自然清肅或遇蝗蟲作害旱潦為災亦當面北存神靜慮至心禮念自然平寧或遇災厄相纒不能解釋亦當面北存神靜慮至心禮念自然清吉或為邪精為怪侵害損傷亦當面北存神靜慮至心禮念自然驅除或遇宅宇不寧財物耗散亦當面北存神靜慮至心禮念自然康寧或遇身遭牢獄酷受苦刑亦當面北存神靜慮至心禮念自然天仙兵馬四聖將軍保護其身此經乃吾家隱祕之文上帝幽玄之典若遇本命生辰及諸齋日清靜身心或為父母或為兄弟或為己身或為骨肉或自禮念或請正一道士或三或五或七以至四十九貟當於聖前至心轉誦亦有靈童力士神王猛將北方兵從依願而行依誠而應爾時天尊即説四聖都呪曰北方有將上帝靈尊披頭仗劔主管四維天上地下咸使聞知刀劒如雨器仗光輝逢魔即殺見善令歸若遇凶災至心轉持飛戈擲火上徹紫微身命之宮有厄相隨急難為吉日月並齊今時即念得獲悲慈三五將軍保護吾身金光靄靄霹靂轟轟逆吾者死避之者生內外家眷得保清寧天罡魅星三十萬兵毒龍猛獸巨海金精貪狼巨門祿存文曲武曲廉貞左輔右弼斬邪破軍真光速到萬鬼潛形急攝急攝不得久停合門昌吉升入無形急急一如太上混元皇帝律今黃紙朱書四聖都符佩帶則無不應驗道言四聖元帥永鎮玉帝殿下統攝三界妖邪每歲常乃降於人間察人善功賜人昌吉保持帝祚覆廕羣迷斷絶惡根增延祿壽若世人精專嚴潔禮念若一遍保錬形骸誦之二遍得獲清寧誦之三遍內外安和誦之四遍神兵自護誦之五遍魔鬼逺潛誦之六遍身絶病苦誦之七遍得見真光誦之百遍三界保舉誦之千遍永覩禧祥誦之萬遍身處仙宮與道合同斯文為修行之徑路作進道之梯航內能保煉其真外可屏除其業靜中觀靜玄中又玄於是諸天仙聖得聞妙義得獲真篇踴躍歡欣喜不可計天君進前作禮上謝天尊而獻頌曰至道尊元包育諸天本寧本靜乃聖乃仙抱黃回紫出青入玄天尊悲慈開演真篇妙理希夷上坤下乾匪雕匪斫弗黨弗偏體而用之身登大千元罡萬化播運機權無為無礙處乎湛然今獲靈文上聖親言若悟之者浩劫綿綿壽齡遐遠福祿長堅得處清靜永向道前天尊告諸天仙曰我等誓願流傳此經若人誠心堅勤即使災消福降永得仙真護持子孫不絶世世生生覩天尊前諸聖説經巳竟受得妙法回車乘鶴鳯輦雲軿拜謝天尊奉辭而退太上九天延祥滌厄四聖妙經
